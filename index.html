<!DOCTYPE html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scorix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Production: /lk/… → base /lk. Demo (GitHub Pages) и локально → "".
      (function () {
        var path = location.pathname || "/";
        var m = path.match(/^(\/lk)(?:\/|$)/);
        window.SCORIX_BASE_PATH = m ? m[1] : "";
        // Гибрид: морда на GitHub Pages → API на сервере (HTTPS по IP через sslip.io,
        // пока свой домен не повешен). CORS на API обязан включать
        // https://ivanlushnikov.github.io. Same-origin /lk на своём домене —
        // location.origin.
        if (
          !window.SCORIX_API_BASE &&
          location.hostname === "ivanlushnikov.github.io"
        ) {
          window.SCORIX_API_BASE = "https://37.27.2.86.sslip.io";
        }
        if (!window.SCORIX_API_BASE) {
          window.SCORIX_API_BASE = location.origin;
        }
        var assetBase = window.SCORIX_BASE_PATH || ".";
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = assetBase + "/src/styles.css";
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var assetBase = window.SCORIX_BASE_PATH || ".";
        var s = document.createElement("script");
        s.type = "module";
        s.src = assetBase + "/src/app.js";
        document.body.appendChild(s);
      })();
    </script>
  </body>
</html>
